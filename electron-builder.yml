appId: com.openrise.app
productName: OpenRise

directories:
  output: dist

files:
  - "**/*"
  - "!src/**/*"
  - "!docs/**/*"
  - "!.git/**/*"
  - "!.github/**/*"
  - "!.next/**/*"
  - "!prisma/migrations/**/*"
  - "!prisma/archives/**/*"
  - "!prisma/agent-archives/**/*"
  - "!prisma/images/**/*"
  - "!prisma/dev.db*"
  - prisma/schema.sql

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg

linux:
  target: AppImage
